openapi: 3.0.0
info:
  title: Photo Caption Contest API
  version: 1.0.0
  description: API for captions, users, authentication and gallery views

servers:
  - url: https://photo-caption-contest-gviy.onrender.com
    description: Production server

paths:

  /:
    get:
      summary: Render login page or redirect to gallery
      tags: [Home]
      responses:
        200:
          description: Login page
          content:
            text/html:
              schema:
                type: string
        302:
          description: Redirect to /gallery

  /gallery:
    get:
      summary: Render gallery page
      tags: [Gallery]
      responses:
        200:
          description: Gallery page
          content:
            text/html:
              schema:
                type: string

  /gallery/{id}:
    get:
      summary: Render image with captions (paginated)
      tags: [Gallery]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        200:
          description: Image page
          content:
            text/html:
              schema:
                type: string
        302:
          description: Redirect if page too high
        404:
          description: Image not found

  /caption/{id}:
    post:
      summary: Add caption
      tags: [Captions]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newcaption]
              properties:
                newcaption:
                  type: string
                  minLength: 1
                  maxLength: 130
      responses:
        201:
          description: Caption added
        400:
          description: Validation error
        401:
          description: Unauthorized

    patch:
      summary: Edit caption
      tags: [Captions]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newcaption]
              properties:
                newcaption:
                  type: string
      responses:
        200:
          description: Caption updated
        403:
          description: Forbidden

    delete:
      summary: Delete caption
      tags: [Captions]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Caption deleted

  /likes/{captionId}:
    post:
      summary: Toggle like (like / unlike)
      tags: [Likes]
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: captionId
          required: true
          schema:
            type: integer
      responses:
        201:
          description: Liked
        204:
          description: Unliked

  /login:
    post:
      summary: Log in user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Logged in
        401:
          description: Invalid credentials

  /register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: User created
        409:
          description: Username taken

    get:
      summary: Render register page
      tags: [Auth]
      responses:
        200:
          description: HTML page
          content:
            text/html:
              schema:
                type: string

  /logout:
    post:
      summary: Logout user
      tags: [Auth]
      responses:
        302:
          description: Redirect to home

  /user/search:
    get:
      summary: Search users
      tags: [Users]
      parameters:
        - in: query
          name: username
          required: true
          schema:
            type: string
      responses:
        200:
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        username:
                          type: string

  /user/{username}:
    get:
      summary: Render user profile
      tags: [Users]
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        200:
          description: HTML page
          content:
            text/html:
              schema:
                type: string
        404:
          description: User not found

  /user/edit-nickname:
    patch:
      summary: Edit username
      tags: [Users]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newNickname]
              properties:
                newNickname:
                  type: string
      responses:
        200:
          description: Updated

  /user/edit-password:
    patch:
      summary: Edit password
      tags: [Users]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        200:
          description: Updated

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: connect.sid